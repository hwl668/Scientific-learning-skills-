[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-learning-skills"
version = "0.3.0"
description = "Diagnosis-first agent skills and utilities for science and engineering learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent-skills", "education", "learning", "router"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.2,<2",
]
validation = [
  "PyYAML>=6,<7",
]

[project.scripts]
learning-agent-ml-router = "learning_agent.ml_router:main"

[tool.setuptools.packages.find]
include = ["learning_agent*"]

[tool.setuptools.package-data]
"learning_agent.resources" = [
  "artifacts/*.json",
  "artifacts/*.json.gz",
  "data/training/*.jsonl",
]
