<g style="animation:kg0 16s linear infinite both"><rect x="40" y="162" width="322" height="42" rx="8" fill="#0d1117" stroke="#30363d"/><text x="52" y="179" font-size="10.5" fill="#e6edf3">矩阵就是按行列排布的数表，</text><text x="52" y="193" font-size="10.5" fill="#9198a1">先从定义说起……</text><circle cx="344" cy="183" r="8" fill="none" stroke="#6e7681"/><text x="344" y="186.5" font-size="9.5" fill="#6e7681" text-anchor="middle">✕</text></g>
