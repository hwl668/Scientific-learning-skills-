<g style="animation:ks0 16s linear infinite both"><rect x="398" y="162" width="322" height="50" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="664" y="170" width="52" height="15" rx="7.5" fill="#ab7df8"/><text x="690.0" y="181" font-size="9" fill="#0d1117" text-anchor="middle">诊断</text><text x="410" y="182" font-size="10.5" fill="#e6edf3">你算矩阵×向量时，心里把那串</text><text x="410" y="196" font-size="10.5" fill="#e6edf3">「乘加」理解成什么？</text></g>
