name: Bench Card

permissions:
  contents: write

on:
  push:
    branches: [main, master]
    paths:
      - "evals/bench/results/**"
      - "scripts/render_bench_card.py"
      - ".github/workflows/bench-card.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly: re-render from whatever results are on the default branch

jobs:
  render:
    name: Refresh bench-card.svg from committed results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Render card from evals/bench/results
        run: python scripts/render_bench_card.py
      - name: Commit refreshed card (if changed)
        run: |
          if [ -n "$(git status --porcelain docs/assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/assets/bench-card.light.svg docs/assets/bench-card.dark.svg
            git commit -m "chore: refresh bench-card.svg from evals/bench/results"
            git push
          else
            echo "bench-card.svg already up to date"
          fi
