name: Check

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontmatter:
    name: Frontmatter & Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validator dependency
        run: python -m pip install -e ".[validation]"
      - name: Parse and validate every Skill
        run: python -B -m learning_agent.validate_skills

  eval-quick:
    name: Python & Eval (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ml,validation]"
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Run deterministic router and diagnosis evals
        run: |
          python -B -m learning_agent.router --eval
          python -B -m learning_agent.diagnosis --eval
      - name: Verify checked-in safe model artifact
        run: |
          python -B -m learning_agent.ml_router evaluate
          python -B -m learning_agent.ml_router predict "我会算矩阵乘法，但不知道它表示什么"
      - name: Run teaching-output evals
        run: |
          python -B eval.py --quick
          python -B -m learning_agent.eval.runner --suite evals/cases/smoke.jsonl --report json
      - name: Build and smoke-test the wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          mkdir -p /tmp/scientific-learning-wheel-smoke
          cd /tmp/scientific-learning-wheel-smoke
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -B -c "from pathlib import Path; import learning_agent; from learning_agent.ml_router import DEFAULT_ARTIFACT; assert '.wheel-venv' in str(Path(learning_agent.__file__).resolve()); assert DEFAULT_ARTIFACT.is_file(); assert 'site-packages/learning_agent/resources/artifacts' in DEFAULT_ARTIFACT.as_posix()"
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -B -c "from learning_agent.ml_router import route; result = route('我会算矩阵乘法，但不知道它表示什么'); assert result['label'] == 'fuzzy-understanding', result"
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -B -m learning_agent.ml_router predict "我会算矩阵乘法，但不知道它表示什么"

  links:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check internal links
        run: |
          errors=0
          for md in README.md README.en.md DESIGN.md CONTRIBUTING.md SECURITY.md; do
            echo "::group::$md"
            # Extract markdown links: [text](path)
            links=$(grep -oP '\[.*?\]\(\.\/[^)]+\)' "$md" || true)
            while IFS= read -r link; do
              [ -z "$link" ] && continue
              # Extract path from [text](path)
              path=$(echo "$link" | grep -oP '(?<=\(\.\/)[^)]+') || true
              if [ -n "$path" ] && [ ! -e "$path" ]; then
                # Check if it's a section anchor
                if [[ "$path" != *"#"* ]] || [ ! -e "${path%%#*}" ]; then
                  echo "  BROKEN: $link"
                  errors=$((errors + 1))
                fi
              fi
            done <<< "$links"
            echo "::endgroup::"
          done

          if [ $errors -gt 0 ]; then
            echo "::error::$errors broken link(s) found"
            exit 1
          else
            echo "All links valid"
          fi
